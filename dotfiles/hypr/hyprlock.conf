$font = JetBrainsMonoNL Nerd Font
$tokyoNightBlue = rgb(7aa2f7)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/Pictures/night-forest.png
    blur_passes = 2
    color = rgb(0D1017)
}

label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
    color = $tokyoNightBlue
    font_size = 55
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor = 
    text = cmd[update:43200000] echo "$(date +"%A, %d %B")"
    color = $tokyoNightBlue
    font_size = 15
    font_family = $font
    position = 0, 45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 275, 50
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $tokyoNightBlue
    inner_color = rgb(131721)
    font_color = $tokyoNightBlue
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    check_color = rgb(00FFAA)
    fail_color = rgb(F07178)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(00FFAA)
    position = 0, -35
    halign = center
    valign = center
}
